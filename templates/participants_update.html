{% extends "base.html" %}
{% block content %}
<h1>Participants Management</h1>
<p><a href="/participants">Add / View</a> | <a href="/participants/update">Update</a> | <a href="/participants/delete">Delete</a></p>

<h3>Search and Update Participant</h3>
<form method="GET">
    <input type="text" name="search" placeholder="Search first or last name" value="{{ search }}">
    <button type="submit">Search</button>
</form>

{% for p in participants %}
<form method="POST">
    <input type="hidden" name="partID" value="{{ p['partID'] }}">
    #{{ p["partID"] }}
    <select name="evCode" required>
        {% for e in events %}
        <option value="{{ e['evCode'] }}" {% if e['evCode'] == p['evCode'] %}selected{% endif %}>{{ e["evName"] }}</option>
        {% endfor %}
    </select>
    <input type="text" name="partFName" value="{{ p['partFName'] }}" required>
    <input type="text" name="partLName" value="{{ p['partLName'] }}" required>
    <input type="number" step="0.01" min="0" max="1" name="partDRate" value="{{ p['partDRate'] }}" required>
    <button type="submit">Update</button>
</form>
{% endfor %}
{% endblock %}
